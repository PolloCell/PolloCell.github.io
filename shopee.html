<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Recomendados Shopee - Apolo Bsa</title>
    <style>
        /* Estilos base focados em mobile (estilo Link-in-bio) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ee4d2d; /* Laranja Shopee */
        }
        .header h1 {
            font-size: 20px;
            color: #333;
            margin: 10px 0 5px 0;
        }
        .header p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }
        
        /* Lista de Produtos */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-card {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(238, 77, 45, 0.15);
            border-color: #ee4d2d;
        }
        .product-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            background-color: #f0f0f0;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-title {
            font-size: 15px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .product-btn {
            font-size: 12px;
            color: #ee4d2d;
            font-weight: bold;
        }
        
        /* Botão de voltar */
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <!-- Substitua pelo link da sua foto de perfil -->
            <img src="URL_DA_SUA_FOTO_AQUI" alt="Apolo Bsa">
            <h1>Recomendados do Apolo</h1>
            <p>Os melhores produtos testados nos vídeos 🎥</p>
        </div>

        <!-- Lista de Links dos Produtos -->
        <div class="product-list">
            
            <!-- PRODUTO 1 -->
            <a href="SEU_LINK_DE_AFILIADO_AQUI" target="_blank" class="product-card">
                <img src="URL_DA_IMAGEM_DO_PRODUTO_AQUI" alt="Produto 1" class="product-img">
                <div class="product-info">
                    <p class="product-title">Microfone de Lapela Sem Fio</p>
                    <span class="product-btn">Ver na Shopee ➔</span>
                </div>
            </a>

            <!-- PRODUTO 2 -->
            <a href="SEU_LINK_DE_AFILIADO_AQUI" target="_blank" class="product-card">
                <img src="URL_DA_IMAGEM_DO_PRODUTO_AQUI" alt="Produto 2" class="product-img">
                <div class="product-info">
                    <p class="product-title">Kit Ferramentas Manutenção Celular</p>
                    <span class="product-btn">Ver na Shopee ➔</span>
                </div>
            </a>

            <!-- PRODUTO 3 -->
            <a href="SEU_LINK_DE_AFILIADO_AQUI" target="_blank" class="product-card">
                <img src="URL_DA_IMAGEM_DO_PRODUTO_AQUI" alt="Produto 3" class="product-img">
                <div class="product-info">
                    <p class="product-title">Ring Light com Tripé</p>
                    <span class="product-btn">Ver na Shopee ➔</span>
                </div>
            </a>

        </div>

        <!-- Botão Voltar -->
        <a href="index.html" class="back-btn">← Voltar para a página principal</a>
    </div>

</body>
</html>
